<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat de Teste – Jorguinho</title>
<style>
  :root{--bg:#efeae2;--head:#008069;--out:#d9fdd3;--in:#fff;--text:#111b21;--sub:#667781;--tick:#53bdeb}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#d1d7db;color:var(--text);display:flex;justify-content:center}
  .app{width:100%;max-width:520px;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;box-shadow:0 0 20px rgba(0,0,0,.15)}
  header{background:var(--head);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px}
  .avatar{width:40px;height:40px;border-radius:50%;background:#dfe5e7;color:#54656f;display:grid;place-items:center;font-weight:700}
  .hinfo{flex:1;min-width:0}
  .hname{font-size:16px;font-weight:600}
  .hstatus{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header button{background:rgba(255,255,255,.15);border:0;color:#fff;padding:7px 10px;border-radius:8px;font-size:12px;cursor:pointer}
  #msgs{flex:1;overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:4px;
    background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
  .day{align-self:center;background:#fff;color:var(--sub);font-size:12px;padding:4px 10px;border-radius:8px;margin:6px 0;box-shadow:0 1px 1px rgba(0,0,0,.08)}
  .msg{max-width:82%;padding:6px 8px 6px 9px;border-radius:8px;font-size:14.5px;line-height:1.35;box-shadow:0 1px 1px rgba(0,0,0,.1);white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
  .msg.out{align-self:flex-end;background:var(--out);border-top-right-radius:0}
  .msg.in{align-self:flex-start;background:var(--in);border-top-left-radius:0}
  .meta{float:right;margin:6px 0 -3px 10px;font-size:11px;color:var(--sub);display:flex;gap:3px;align-items:center}
  .tick{color:var(--sub);font-size:13px;letter-spacing:-3px}
  .tick.read{color:var(--tick)}
  .typing{align-self:flex-start;background:#fff;border-radius:8px;border-top-left-radius:0;padding:10px 14px;box-shadow:0 1px 1px rgba(0,0,0,.1);display:none}
  .typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#9aa6ad;animation:b 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
  footer{background:#f0f2f5;padding:8px;display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;border:0;border-radius:20px;padding:10px 14px;font:inherit;font-size:15px;resize:none;max-height:120px;outline:none}
  #send{width:44px;height:44px;border-radius:50%;border:0;background:#00a884;color:#fff;font-size:18px;cursor:pointer;flex:none}
  #send:disabled{opacity:.5}
  #err{background:#fff3cd;color:#664d03;font-size:12px;padding:6px 12px;display:none}
  .modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;padding:20px}
  .box{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:380px}
  .box h3{margin-bottom:10px}
  .box label{font-size:12px;color:var(--sub);display:block;margin:8px 0 3px}
  .box input{width:100%;padding:9px;border:1px solid #ccd;border-radius:8px;font:inherit}
  .box .row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
  .box button{padding:8px 14px;border:0;border-radius:8px;cursor:pointer;background:#00a884;color:#fff}
  .box button.g{background:#e9edef;color:#111}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">J</div>
    <div class="hinfo"><div class="hname">Jorguinho (teste)</div><div class="hstatus" id="status">online</div></div>
    <button id="btnNew" title="Começa um novo contato e uma nova conversa">Nova conversa</button>
  </header>
  <div id="err"></div>
  <div id="msgs"><div class="day">HOJE</div><div class="typing" id="typing"><span></span><span></span><span></span></div></div>
  <footer>
    <textarea id="txt" rows="1" placeholder="Digite uma mensagem"></textarea>
    <button id="send" aria-label="Enviar">&#10148;</button>
  </footer>

  <div class="modal" id="modal"><div class="box">
    <h3>Quem está testando?</h3>
    <label>Nome do contato</label><input id="inName" placeholder="Bianca">
    <div class="row"><button id="go">Começar</button></div>
  </div></div>
</div>

<script>
// ======== CONFIGURAÇÃO ========
const BASE_URL = "https://chat.nexaomni.com.br";
const INBOX_IDENTIFIER = "JyKtBaGmXJorKvajwJDssN2r";
const POLL_MS = 2500;
// ==============================

const $ = id => document.getElementById(id);
const msgsEl = $("msgs"), typingEl = $("typing"), txt = $("txt");
const API = `${BASE_URL}/public/api/v1/inboxes/${INBOX_IDENTIFIER}`;
const KEY = "jorguinho_chat_v1";
let state = load();
let seen = new Set();
let pending = 0; // mensagens enviadas aguardando resposta
let timer = null;

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function showErr(m){ const e=$("err"); e.textContent=m; e.style.display=m?"block":"none"; }
function hhmm(ts){ const d=new Date(ts*1000); return d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }

async function api(path, opts={}){
  const r = await fetch(API+path, {headers:{"Content-Type":"application/json"}, ...opts});
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function ensureSession(){
  if(!state.contact){
    $("modal").style.display="grid";
    await new Promise(res => { $("go").onclick = () => {
      state.name = $("inName").value.trim() || "Teste";
      $("modal").style.display="none"; res();
    };});
    const body = {name: state.name};
    const c = await api("/contacts", {method:"POST", body:JSON.stringify(body)});
    state.contact = c.source_id || c.pubsub_token && c.source_id;
    state.pubsub = c.pubsub_token;
    save();
  }
  if(!state.conv){
    const cv = await api(`/contacts/${state.contact}/conversations`, {method:"POST", body:"{}"});
    state.conv = cv.id; save();
  }
}

function addMsg(m){
  if(seen.has(m.id)) return;
  seen.add(m.id);
  // message_type: 0 = entrada (contato), 1 = saída (IA/agente), 2 = atividade, 3 = template
  if(m.message_type === 2) return;
  if(m.private) return;
  const out = m.message_type === 0;
  const div = document.createElement("div");
  div.className = "msg " + (out ? "out" : "in");
  const content = (m.content || "").trim();
  const att = (m.attachments||[]).map(a=>a.data_url?`\n📎 ${a.data_url}`:"").join("");
  div.textContent = content + att;
  const meta = document.createElement("span");
  meta.className = "meta";
  meta.innerHTML = hhmm(m.created_at) + (out ? ' <span class="tick read">✓✓</span>' : "");
  div.appendChild(meta);
  msgsEl.insertBefore(div, typingEl);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  if(!out){ pending = 0; typingEl.style.display = "none"; $("status").textContent = "online"; }
}

async function poll(){
  if(!state.conv) return;
  try{
    const r = await api(`/contacts/${state.contact}/conversations/${state.conv}/messages`);
    const list = Array.isArray(r) ? r : (r.payload || []);
    list.sort((a,b)=>a.created_at-b.created_at).forEach(addMsg);
    showErr("");
  }catch(e){ showErr("Sem conexão com o servidor ("+e.message+"). Tentando de novo..."); }
}

async function send(){
  const t = txt.value.trim();
  if(!t) return;
  txt.value=""; txt.style.height="auto";
  $("send").disabled = true;
  try{
    await ensureSession();
    const m = await api(`/contacts/${state.contact}/conversations/${state.conv}/messages`,
      {method:"POST", body:JSON.stringify({content:t, echo_id:String(Date.now())})});
    addMsg({id:m.id, content:m.content||t, message_type:0, created_at:m.created_at||Math.floor(Date.now()/1000)});
    pending++; typingEl.style.display="block"; $("status").textContent="digitando...";
    msgsEl.scrollTop = msgsEl.scrollHeight;
    poll();
    // evita "digitando" eterno caso a IA não responda
    setTimeout(()=>{ if(pending){ typingEl.style.display="none"; $("status").textContent="online"; } }, 60000);
  }catch(e){
    const net = e instanceof TypeError;
    showErr("Falha ao enviar: "+e.message+(net?" — sem acesso ao servidor. Abra a página pelo link https:// (não pelo arquivo no computador), desative bloqueadores de anúncio/VPN e tente de novo.":""));
    if(!state.conv){ state.contact=null; save(); }
    txt.value=t; }
  finally{ $("send").disabled=false; txt.focus(); }
}

function reset(){
  if(!confirm("Começar uma nova conversa com outro contato?")) return;
  state = {}; save(); seen = new Set(); pending = 0;
  [...msgsEl.querySelectorAll(".msg")].forEach(n=>n.remove());
  typingEl.style.display="none";
}

$("send").onclick = send;
$("btnNew").onclick = reset;
txt.addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }});
txt.addEventListener("input", ()=>{ txt.style.height="auto"; txt.style.height=Math.min(txt.scrollHeight,120)+"px"; });
timer = setInterval(poll, POLL_MS);
poll();
</script>
</body>
</html>
